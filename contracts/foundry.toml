[profile.default]
out = "out"
src = "src"
test = "test"
script = "script"
libs = ["node_modules", "lib"]
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
verbosity = 2

[lint]
lint_on_build = false

[rpc_endpoints]
creditcoin_testnet = "${CREDITCOIN_RPC_URL}"
sepolia = "${SOURCE_CHAIN_RPC_URL}"
